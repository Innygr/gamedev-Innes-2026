<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>t1a06-proper-and-variables-Innes.html</title>
<style>
b {color: blue;}
#toggle {
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        green,
        blue,
        indigo,
        violet
      );
      background-size: 400% 100%; /* Make gradient wider for animation */
      -webkit-background-clip: text; /* Clip background to text */
      -webkit-text-fill-color: transparent; /* Hide solid text color */
      animation: rainbow 5s linear infinite; /* Animate gradient */
      border: 2px solid #ccc;
      padding: 10px 20px;
      cursor: pointer;
    }

    /* Animation to shift the gradient */
    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
</style>
<script>
function sayHello() {
let myNum = 3;
let myString = ' Hello ';
let myFloat = 17.5;
let myBool = true;
let myOut = document.getElementById('myDiv01');
myOut.innerHTML = myNum + myString + myFloat +', ' + myBool;
if (myBool) {myOut.innerHTML += ', WOW';}
}
function myToggle() {
  let myBool = true;
myBool = !myBool;
myBool = !myBool;
}
</script>
</head>
<body>
<p>This is <b>Bold</b> text.</p>
<button onclick="sayHello()">Click me if you want ig</button>
<div id="myDiv01">Output here or smth</div><br>
  <br>
<button id="toggle" onclick="myToggle()">Toggle myBool Value</button>
</body>
</html>
