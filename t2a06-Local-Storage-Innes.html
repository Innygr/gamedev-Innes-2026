<h2 align="center">t2a07 // 23 Canvas by Innes</h2>

<p>Use the buttons to draw different shapes on the canvas!</p>

<input type="button" value="Draw Basic Shapes" onclick="{
  myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);

  // Line
  myContext.beginPath();
  myContext.lineWidth = 3;
  myContext.strokeStyle = 'black';
  myContext.moveTo(20, 30);
  myContext.lineTo(180, 30);
  myContext.stroke();

  // Filled Rectangle
  myContext.fillStyle = 'blue';
  myContext.fillRect(30, 60, 100, 60);

  // Outlined Rectangle
  myContext.lineWidth = 3;
  myContext.strokeStyle = 'purple';
  myContext.strokeRect(160, 60, 100, 60);

  // Outlined Circle
  myContext.beginPath();
  myContext.lineWidth = 5;
  myContext.strokeStyle = 'green';
  myContext.arc(330, 90, 40, 0, 2 * Math.PI);
  myContext.stroke();

  // Filled Circle
  myContext.beginPath();
  myContext.fillStyle = 'orange';
  myContext.arc(420, 90, 30, 0, 2 * Math.PI);
  myContext.fill();

  // Text
  myContext.fillStyle = 'red';
  myContext.font = '24px Arial';
  myContext.fillText('Hello World!', 30, 180);

  // Triangle
  myContext.beginPath();
  myContext.fillStyle = 'cyan';
  myContext.moveTo(250, 220);
  myContext.lineTo(200, 280);
  myContext.lineTo(300, 280);
  myContext.closePath();
  myContext.fill();
}">

<input type="button" value="Draw Grid" onclick="{
  myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);

  myContext.strokeStyle = '#cccccc';
  myContext.lineWidth = 1;

  for (let x = 0; x <= myCanvas.width; x += 25) {
    myContext.beginPath();
    myContext.moveTo(x, 0);
    myContext.lineTo(x, myCanvas.height);
    myContext.stroke();
  }

  for (let y = 0; y <= myCanvas.height; y += 25) {
    myContext.beginPath();
    myContext.moveTo(0, y);
    myContext.lineTo(myCanvas.width, y);
    myContext.stroke();
  }
}">

<input type="button" value="Clear Canvas" onclick="{
  myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);
}">

<br><br>

<canvas id="myCanvas+++" width="500" height="300"
style="border:1px solid #000000; background-color:white;"></canvas>

<script>
  let myCanvas = document.getElementById('myCanvas+++');
  let myContext = myCanvas.getContext('2d');
</script>


<hr>

<h2 align="center">t2a07 // 3D Canvas Experiment</h2>

<p>Welcome to the third dimension! Watch the objects rotate in 3D.</p>

<div id="my3DContainer" style="
  width: 100%;
  max-width: 600px;
  height: 350px;
  margin: auto;
  border: 2px solid #555;
  border-radius: 10px;
  overflow: hidden;
  background: #101020;
"></div>

<br>

<input type="button" value="Pause / Resume" onclick="{
  my3DPaused = !my3DPaused;
}">

<input type="button" value="Change Shape Colours" onclick="{
  my3DCube.material.color.setHex(Math.random() * 0xffffff);
  my3DSphere.material.color.setHex(Math.random() * 0xffffff);
  my3DTorus.material.color.setHex(Math.random() * 0xffffff);
}">

<input type="button" value="Reset Camera" onclick="{
  my3DCamera.position.set(0, 2, 7);
  my3DCamera.lookAt(0, 0, 0);
}">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
  let my3DScene = new THREE.Scene();
  my3DScene.background = new THREE.Color(0x101020);

  let my3DCamera = new THREE.PerspectiveCamera(
    75, 600 / 350, 0.1, 1000
  );

  let my3DRenderer = new THREE.WebGLRenderer({ antialias: true });
  my3DRenderer.setSize(600, 350);
  my3DRenderer.setPixelRatio(window.devicePixelRatio);

  document.getElementById('my3DContainer').appendChild(my3DRenderer.domElement);

  my3DCamera.position.set(0, 2, 7);

  // Lighting
  let my3DLight = new THREE.PointLight(0xffffff, 2);
  my3DLight.position.set(5, 5, 5);
  my3DScene.add(my3DLight);

  my3DScene.add(new THREE.AmbientLight(0xffffff, 0.5));

  // Cube
  let my3DCube = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 1.5, 1.5),
    new THREE.MeshStandardMaterial({ color: 0x0088ff })
  );
  my3DCube.position.x = -2;
  my3DScene.add(my3DCube);

  // Sphere
  let my3DSphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0x00ff88 })
  );
  my3DScene.add(my3DSphere);

  // Torus
  let my3DTorus = new THREE.Mesh(
    new THREE.TorusGeometry(0.8, 0.25, 16, 100),
    new THREE.MeshStandardMaterial({ color: 0xff0088 })
  );
  my3DTorus.position.x = 2;
  my3DScene.add(my3DTorus);

  // Animation
  let my3DPaused = false;

  function my3DAnimate() {
    requestAnimationFrame(my3DAnimate);

    if (!my3DPaused) {
      my3DCube.rotation.x += 0.01;
      my3DCube.rotation.y += 0.015;

      my3DSphere.rotation.y += 0.02;

      my3DTorus.rotation.x += 0.01;
      my3DTorus.rotation.y += 0.02;
    }

    my3DRenderer.render(my3DScene, my3DCamera);
  }

  my3DAnimate();

  // Resize support
  window.addEventListener('resize', function() {
    let my3DWidth = document.getElementById('my3DContainer').clientWidth;

    my3DCamera.aspect = my3DWidth / 350;
    my3DCamera.updateProjectionMatrix();

    my3DRenderer.setSize(my3DWidth, 350);
  });
</script>
