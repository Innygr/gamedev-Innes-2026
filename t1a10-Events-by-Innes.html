<h2 align=center>t1a10 events by Innes.html</h2>

<a href="https://way2tutorial.com/html/html5_events_handler_list.php">
Good reference to HTML Events</a><br>

Events are HTML code that activates JS code<br><br>

<input type=text id="myText01" value="3"><br>

<input type=button value="Example onClick" onClick="{
  document.getElementById('myDiv01').innerHTML =
  document.getElementById('myText01').value
}">
<div id="myDiv01">...</div>

<b id="myB02"
onMouseOut="{
  document.getElementById('myB02').innerHTML = 'This is nice'
}"
onMouseOver="{
  document.getElementById('myB02').innerHTML = 'This is cool'
}">
This is BOLD
</b>
<br><br>

<!-- 1. onDblClick -->
<button ondblclick="{
  document.getElementById('eventOutput').innerHTML = 'You double-clicked!'
}">
Double Click Me
</button>

<br><br>

<!-- 2. onMouseDown -->
<button onmousedown="{
  document.getElementById('eventOutput').innerHTML = 'Mouse button is down!'
}">
Hold Mouse Button
</button>

<br><br>

<!-- 3. onMouseUp -->
<button onmouseup="{
  document.getElementById('eventOutput').innerHTML = 'Mouse button released!'
}">
Release Mouse Button
</button>

<br><br>

<!-- 4. onMouseMove -->
<div
style="width:200px;height:50px;border:1px solid black;"
onmousemove="{
  document.getElementById('eventOutput').innerHTML = 'Mouse is moving!'
}">
Move your mouse here
</div>

<br>

<!-- 5. onFocus -->
<input type="text"
onfocus="{
  document.getElementById('eventOutput').innerHTML = 'The text box is focused!'
}"
placeholder="Click here">

<br><br>

<!-- 6. onBlur -->
<input type="text"
onblur="{
  document.getElementById('eventOutput').innerHTML = 'You left the text box!'
}"
placeholder="Click somewhere else">

<br><br>

<!-- 7. onChange -->
<select onchange="{
  document.getElementById('eventOutput').innerHTML =
  'You selected: ' + this.value
}">
  <option value="Red">Red</option>
  <option value="Blue">Blue</option>
  <option value="Green">Green</option>
</select>

<br><br>

<!-- 8. onKeyDown -->
<input type="text"
onkeydown="{
  document.getElementById('eventOutput').innerHTML = 'A key was pressed down!'
}"
placeholder="Press a key">

<br><br>

<!-- 9. onKeyUp -->
<input type="text"
onkeyup="{
  document.getElementById('eventOutput').innerHTML = 'A key was released!'
}"
placeholder="Release a key">

<br><br>

<!-- 10. onInput -->
<input type="text"
oninput="{
  document.getElementById('eventOutput').innerHTML =
  'You typed: ' + this.value
}"
placeholder="Type something">

<br><br>

<div id="eventOutput">Events will appear here!</div>
