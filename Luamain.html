```html
<!-- THREE.JS -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

/* -------------------------
   Scene
------------------------- */

const container = document.getElementById("negInnyContainer");
const status = document.getElementById("modelStatus");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09050f);


/* -------------------------
   Camera
------------------------- */

const camera = new THREE.PerspectiveCamera(
  45,
  container.clientWidth / container.clientHeight,
  0.1,
  1000
);

camera.position.set(0, 2, 8);


/* -------------------------
   Renderer
------------------------- */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.shadowMap.enabled = true;

container.appendChild(renderer.domElement);


/* -------------------------
   Lights
------------------------- */

const ambientLight = new THREE.AmbientLight(
  0xffffff,
  1.8
);

scene.add(ambientLight);


const keyLight = new THREE.DirectionalLight(
  0xffffff,
  3
);

keyLight.position.set(4, 7, 6);
keyLight.castShadow = true;

scene.add(keyLight);


const purpleLight = new THREE.PointLight(
  0xa855f7,
  18,
  20
);

purpleLight.position.set(
  -4,
  2,
  4
);

scene.add(purpleLight);


/* -------------------------
   Floor
------------------------- */

const floorGeometry =
  new THREE.CircleGeometry(4, 64);

const floorMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x13091c,
    roughness: 0.8,
    metalness: 0.2
  });

const floor =
  new THREE.Mesh(
    floorGeometry,
    floorMaterial
  );

floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.2;
floor.receiveShadow = true;

scene.add(floor);


/* -------------------------
   FBX
------------------------- */

let negInny = null;

const loader = new FBXLoader();

loader.load(
  "./NegInny.fbx",

  function (model) {

    console.log("NegInny.fbx loaded:", model);

    negInny = model;

    /*
     * FBX models often use much larger
     * units than Three.js scenes.
     */
    negInny.scale.set(
      0.01,
      0.01,
      0.01
    );

    negInny.position.set(
      0,
      -1.8,
      0
    );


    negInny.traverse(function (child) {

      if (child.isMesh) {

        child.castShadow = true;
        child.receiveShadow = true;

        if (child.material) {
          child.material.needsUpdate = true;
        }

      }

    });


    scene.add(negInny);

    status.textContent =
      "NegInny.fbx // ONLINE";
  },


  function (progress) {

    if (progress.total > 0) {

      const percent =
        Math.round(
          (progress.loaded / progress.total) * 100
        );

      status.textContent =
        "Loading NegInny.fbx... " +
        percent +
        "%";
    }

  },


  function (error) {

    console.error(
      "Could not load NegInny.fbx:",
      error
    );

    status.textContent =
      "ERROR // NegInny.fbx could not load";
  }
);


/* -------------------------
   Animation
------------------------- */

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const time =
    clock.getElapsedTime();


  if (negInny) {

    // Slow Celestan rotation
    negInny.rotation.y =
      time * 0.35;


    // Small floating movement
    negInny.position.y =
      -1.8 +
      Math.sin(time * 1.5) * 0.12;
  }


  renderer.render(
    scene,
    camera
  );
}

animate();


/* -------------------------
   Resize
------------------------- */

window.addEventListener(
  "resize",
  function () {

    const width =
      container.clientWidth;

    const height =
      container.clientHeight;


    camera.aspect =
      width / height;

    camera.updateProjectionMatrix();


    renderer.setSize(
      width,
      height
    );
  }
);
</script>
