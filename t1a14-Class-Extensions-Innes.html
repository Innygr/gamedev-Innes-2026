<script>
  class myAnimal {
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
    }
    myShow(){
      document.getElementById('myDiv01').innerHTML = 'Hello ' + this.myName + '<br>'
    }
  }
</script>
<h2 align=center>t1a14-class-extend-innes.html</h2>
Extending a pre-existing class<br>
<input type=text id="myText01">
<input type=number id="myIn01">

<h4>Example working Class code</h4>

<input type=button value="Example Class Set and Show Class Animal" onClick="{

  let myNum01 = parseFloat(document.getElementById('myIn01').value)
  let myDog = new myAnimal(myText01, myNum01)
  myDog.myShow()

  }">
