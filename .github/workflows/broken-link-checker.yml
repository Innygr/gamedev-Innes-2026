name: Broken Link Checker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Every Monday at 16:00 UTC
    - cron: "0 16 * * 1"

permissions:
  contents: read

concurrency:
  group: broken-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check local and external links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links in HTML and Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            "./**/*.html"
            "./**/*.htm"
            "./**/*.md"
          fail: true
          jobSummary: true
