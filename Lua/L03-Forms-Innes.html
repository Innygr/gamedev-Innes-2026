<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3 — Forms — Innes</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #0d0714;
            color: #e9ddff;
            font-family: "Fira Code", monospace;
        }

        h1, h3 { color: #c77dff; }

        .section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(25, 12, 40, 0.85);
            border: 1px solid #7c3aed;
            border-radius: 12px;
        }

        textarea#code {
            width: 100%;
            min-height: 300px;
            box-sizing: border-box;
            padding: 15px;
            background: #08050b;
            color: #e9ddff;
            border: 1px solid #7c3aed;
            border-radius: 8px;
            font: 14px "Fira Code", monospace;
        }

        button {
            margin: 12px 8px 0 0;
            padding: 10px 18px;
            background: #24113d;
            color: #e9ddff;
            border: 1px solid #a855f7;
            border-radius: 7px;
            cursor: pointer;
        }

        #output {
            min-height: 50px;
            padding: 15px;
            background: #050505;
            border: 1px solid #7c3aed;
            border-radius: 8px;
            color: #b7ffcf;
            white-space: pre-wrap;
        }

        #formPreview {
            padding: 20px;
            background: #fff;
            color: #111;
            border-radius: 8px;
        }

        #formPreview input,
        #formPreview textarea,
        #formPreview select {
            margin: 4px;
        }

        .green { color: green; }
        .red { color: red; }
    </style>
</head>
<body>
    <h6>Version 0.0.1</h6>
    <h1>L3 — Forms</h1>

    <div class="section">
        <h2>◆ Luau Code</h2>
        <textarea id="code">local formTitle = "Proving that you can use forms"

local fields = {
    {label = "First Name", type = "text", id = "myText01", value = "Innes"},
    {label = "Beef", type = "checkbox", color = "red"},
    {label = "Veggy", type = "checkbox", color = "green"},
    {label = "Radio 95.4", type = "radio", name = "radioStation"},
    {label = "Radio 101", type = "radio", name = "radioStation"},
    {label = "Hidden", type = "hidden"},
    {label = "File", type = "file"},
    {label = "Reset", type = "reset"},
    {label = "Submit (advanced)", type = "submit"}
}

print(formTitle)
print("Form fields:", #fields)

for index, field in ipairs(fields) do
    print(index .. ". " .. field.label .. " (" .. field.type .. ")")
end

renderForm(formTitle, fields)</textarea>

        <button id="runButton">▶ Run Luau</button>
        <button id="clearButton">Clear</button>
        <button id="resetButton">Reset</button>
    </div>

    <div class="section">
        <h2>◆ Output</h2>
        <pre id="output">Ready.</pre>
    </div>

    <div class="section">
        <h2>◆ Form Preview</h2>
        <div id="formPreview">Run the Luau code to create the form.</div>
    </div>

    <script type="module">
        import { runLuau } from "./LuauRuntime.js";

        const code = document.getElementById("code");
        const output = document.getElementById("output");
        const preview = document.getElementById("formPreview");
        const originalCode = code.value;

        function renderForm(title, fields) {
            preview.replaceChildren();

            const heading = document.createElement("h3");
            heading.textContent = title;
            preview.appendChild(heading);

            const description = document.createElement("p");
            description.textContent = "The following are all form elements:";
            preview.appendChild(description);

            const form = document.createElement("form");
            form.addEventListener("submit", event => event.preventDefault());

            for (const field of fields) {
                const line = document.createElement("div");

                if (field.type !== "hidden") {
                    const label = document.createElement("label");
                    label.textContent = field.label + ": ";
                    if (field.color) label.style.color = field.color;
                    line.appendChild(label);
                }

                const input = document.createElement("input");
                input.type = field.type;
                if (field.id) input.id = field.id;
                if (field.value !== undefined) input.value = field.value;
                if (field.name) input.name = field.name;

                if (field.type === "hidden") {
                    form.appendChild(input);
                    continue;
                }

                line.appendChild(input);
                form.appendChild(line);
            }

            const buttonLine = document.createElement("div");
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = "Click";
            button.addEventListener("click", () => {
                const area = form.querySelector("#myArea01");
                if (area) area.value = "Cool";
            });
            buttonLine.append("Button: ", button);
            form.appendChild(buttonLine);

            const areaLabel = document.createElement("p");
            areaLabel.textContent = "Textarea:";
            form.appendChild(areaLabel);

            const area = document.createElement("textarea");
            area.id = "myArea01";
            area.cols = 60;
            area.rows = 3;
            area.value = "Cool this works";
            form.appendChild(area);

            const selectLabel = document.createElement("p");
            selectLabel.textContent = "Select Box:";
            form.appendChild(selectLabel);

            const select = document.createElement("select");
            select.id = "mySelect01";
            select.size = 2;

            for (const [value, label] of [
                ["myDog", "Dog"],
                ["myCat", "Cat"],
                ["myMouse", "Mouse (computer)"]
            ]) {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = label;
                select.appendChild(option);
            }

            select.addEventListener("change", () => {
                area.value = select.value;
            });

            form.appendChild(select);

            const radioImage = document.createElement("img");
            radioImage.src = "../Radio.png";
            radioImage.width = 50;
            radioImage.alt = "Radio buttons";
            form.appendChild(document.createElement("br"));
            form.appendChild(radioImage);

            preview.appendChild(form);
        }

        document.getElementById("runButton").addEventListener("click", async () => {
            output.textContent = "";
            preview.textContent = "Running Luau...";
            const success = await runLuau(code.value, output, { renderForm });

            if (!success) {
                preview.textContent = "Form could not be rendered. Check the output for errors.";
            }
        });

        document.getElementById("clearButton").addEventListener("click", () => {
            output.textContent = "";
            preview.textContent = "";
        });

        document.getElementById("resetButton").addEventListener("click", () => {
            code.value = originalCode;
            output.textContent = "Ready.";
            preview.textContent = "Run the Luau code to create the form.";
        });
    </script>
</body>
</html>
