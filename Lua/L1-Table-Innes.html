<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L1 — Table — Innes</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #0d0714;
      color: #e9ddff;
      font-family: "Fira Code", monospace;
    }

    h1 {
      color: #c77dff;
    }

    .section {
      margin: 20px 0;
      padding: 20px;
      background: rgba(25, 12, 40, 0.85);
      border: 1px solid #7c3aed;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      box-sizing: border-box;
      padding: 15px;
      background: #08050b;
      color: #e9ddff;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      font-family: "Fira Code", monospace;
      font-size: 14px;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      margin-right: 8px;
      padding: 10px 18px;
      background: #24113d;
      color: #e9ddff;
      border: 1px solid #a855f7;
      border-radius: 7px;
      cursor: pointer;
    }

    button:hover {
      background: #3b1b5f;
    }

    #output {
      min-height: 100px;
      padding: 15px;
      background: #050505;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-x: auto;
      color: #b7ffcf;
    }

    #tableOutput {
      margin-top: 20px;
      overflow-x: auto;
    }

    #tableOutput table {
      border-collapse: collapse;
      margin: 10px 0;
    }

    #tableOutput td {
      padding: 6px 10px;
      border: 1px solid #888;
      text-align: center;
    }

    #tableOutput img {
      vertical-align: middle;
    }

    #tableOutput a {
      color: #c77dff;
    }

    .error {
      color: #ff7777;
    }
  </style>

</head>

<body>

  <h1>L1 — Table</h1>

  <div class="section">

    <h2>◆ Luau Code</h2>

    <textarea id="code">local table1 = {
    {"A", 1}
}

local table2 = {
    {1, "A"},
    {2, "B"}
}

local table3 = {
    {1, "A", "yes"},
    {2, "B", "hi"}
}

local celestans = {
    {1, "A", "Celestans"},
    {2, "B", "Brightstar"},
    {3, "C", "NegInny"},
    {4, "D", "Boltlight"}
}

print("Table examples created!")

displayTable(table1)
displayTable(table2)
displayTable(table3)
displayTable(celestans)</textarea>

    <br>

    <button id="runButton">
      ▶ Run Luau
    </button>

    <button id="clearButton">
      Clear
    </button>

    <button id="resetButton">
      Reset
    </button>

  </div>

  <div class="section">

    <h2>◆ Output</h2>

    <div id="output">Ready.</div>

    <div id="tableOutput"></div>

  </div>

  <script type="module">

    import { runLuau }
      from "./LuauRuntime.js";


    const code =
      document.getElementById("code");

    const output =
      document.getElementById("output");

    const tableOutput =
      document.getElementById("tableOutput");

    const runButton =
      document.getElementById("runButton");

    const clearButton =
      document.getElementById("clearButton");

    const resetButton =
      document.getElementById("resetButton");


    const originalCode =
      code.value;


    function renderTable(data) {

      if (!Array.isArray(data)) {
        return;
      }

      const htmlTable =
        document.createElement("table");

      for (const row of data) {

        const htmlRow =
          document.createElement("tr");

        if (!Array.isArray(row)) {

          const cell =
            document.createElement("td");

          cell.textContent =
            String(row);

          htmlRow.appendChild(cell);
          htmlTable.appendChild(htmlRow);

          continue;
        }

        for (const value of row) {

          const cell =
            document.createElement("td");


          if (
            typeof value === "string" &&
            (
              value.endsWith(".png") ||
              value.endsWith(".jpg") ||
              value.endsWith(".jpeg") ||
              value.endsWith(".webp")
            )
          ) {

            const image =
              document.createElement("img");

            image.src = value;
            image.width = 25;
            image.alt = value;

            cell.appendChild(image);

          }

          else if (
            typeof value === "string" &&
            value.startsWith("https://")
          ) {

            const link =
              document.createElement("a");

            link.href = value;
            link.textContent = "Cool thing here!";
            link.target = "_blank";

            cell.appendChild(link);

          }

          else {

            cell.textContent =
              String(value);

          }

          htmlRow.appendChild(cell);
        }

        htmlTable.appendChild(htmlRow);
      }

      tableOutput.appendChild(htmlTable);
    }


    function setupTableBridge() {

      return {
        displayTable: renderTable
      };

    }


    runButton.addEventListener(
      "click",
      async () => {

        output.textContent = "";
        tableOutput.innerHTML = "";

        runButton.disabled = true;

        await runLuau(
          code.value,
          output,
          setupTableBridge()
        );

        runButton.disabled = false;
      }
    );


    clearButton.addEventListener(
      "click",
      () => {

        output.textContent = "";
        tableOutput.innerHTML = "";

      }
    );


    resetButton.addEventListener(
      "click",
      () => {

        code.value =
          originalCode;

        output.textContent =
          "Ready.";

        tableOutput.innerHTML =
          "";

      }
    );

  </script>

</body>

</html>
