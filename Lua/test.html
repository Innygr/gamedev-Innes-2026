<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Luau Runtime Test</title>

  <style>

    body {
      margin: 0;
      padding: 30px;

      background: #0d0714;
      color: #e9ddff;

      font-family: monospace;
    }


    h1 {
      color: #c77dff;
    }


    button {
      padding: 10px 18px;
      margin-bottom: 15px;

      cursor: pointer;

      background: #24113d;
      color: #e9ddff;

      border: 1px solid #7c3aed;
      border-radius: 6px;
    }


    button:hover {
      background: #3b1b5f;
    }


    #output {

      background: #050505;

      border: 1px solid #7c3aed;
      border-radius: 8px;

      padding: 15px;

      min-height: 150px;

      white-space: pre-wrap;

      color: #b7ffcf;

    }

  </style>

</head>

<body>

  <h1>Luau Runtime Test</h1>

  <button id="runButton">
    Run test.lua
  </button>

  <div id="output">
    Waiting...
  </div>

  <script type="module">

    import { runLuau }
      from "./LuauRuntime.js";


    const output =
      document.getElementById("output");


    const runButton =
      document.getElementById("runButton");


    async function runTest() {

      runButton.disabled = true;

      output.textContent =
        "Loading test.lua...";


      try {

        const response =
          await fetch("./test.lua");


        if (!response.ok) {

          throw new Error(
            "Could not load test.lua (" +
            response.status +
            ")"
          );

        }


        const code =
          await response.text();


        await runLuau(
          code,
          output
        );


      } catch (error) {

        output.textContent =
          "ERROR:\n" +
          String(error);

        console.error(error);

      }


      runButton.disabled = false;

    }


    runButton.addEventListener(
      "click",
      runTest
    );

  </script>

</body>

</html>
