<section id="assignment-feedback" aria-labelledby="feedback-heading" style="max-width:760px;margin:3rem auto 1.5rem;padding:1.25rem;border:1px solid #64748b;border-radius:12px;background:#111827;color:#f8fafc;font-family:inherit;">
  <h2 id="feedback-heading" style="margin-top:0;">Assignment Feedback</h2>
  <p>Found an issue, have a suggestion, or want to share feedback about this assignment? Send it here.</p>
  <form id="assignmentFeedbackForm">
    <label for="feedbackRating" style="display:block;margin:.75rem 0 .35rem;">Feedback type</label>
    <select id="feedbackRating" name="rating" style="box-sizing:border-box;width:100%;padding:.65rem;border-radius:6px;">
      <option value="Suggestion">Suggestion</option>
      <option value="Issue">Report an issue</option>
      <option value="Question">Question</option>
      <option value="Other">Other feedback</option>
    </select>
    <label for="feedbackMessage" style="display:block;margin:.75rem 0 .35rem;">Your feedback</label>
    <textarea id="feedbackMessage" name="message" required maxlength="2000" rows="5" placeholder="Write your feedback here…" style="box-sizing:border-box;width:100%;padding:.7rem;border-radius:6px;resize:vertical;"></textarea>
    <button type="submit" style="margin-top:.75rem;padding:.65rem 1rem;border:0;border-radius:6px;cursor:pointer;">Send Feedback</button>
    <p id="feedbackStatus" role="status" aria-live="polite" style="margin-bottom:0;"></p>
  </form>
  <small>Please don't include passwords or other sensitive personal information.</small>
</section>
<script>
(() => {
  const form = document.getElementById("assignmentFeedbackForm");
  if (!form) return;
  const status = document.getElementById("feedbackStatus");
  const button = form.querySelector('button[type="submit"]');
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("feedbackMessage").value.trim();
    if (!message) return;
    button.disabled = true;
    status.textContent = "Sending feedback…";
    try {
      const response = await fetch("https://gamedev-class-checklist.innygrant.workers.dev/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          page: location.pathname.split("/").pop(),
          rating: document.getElementById("feedbackRating").value,
          message
        })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Feedback could not be sent.");
      form.reset();
      status.textContent = "Feedback sent successfully. Thank you!";
    } catch (error) {
      status.textContent = error.message || "Could not send feedback. Please try again later.";
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
