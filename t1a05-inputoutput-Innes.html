    @keyframes rainbow {
      0% {
        background: #ff0000;
      }

      14% {
        background: #ff8000;
      }

      28% {
        background: #ffff00;
      }

      42% {
        background: #00ff00;
      }

      57% {
        background: #00ffff;
      }

      71% {
        background: #0080ff;
      }

      85% {
        background: #8000ff;
      }

      100% {
        background: #ff0000;
      }
    }
