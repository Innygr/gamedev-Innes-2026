<script>

  function myExampleFunction(){
    let myIn01 = parseInt(document.getElementById('myText01').value)
    let myIn02 = parseInt(document.getElementById('myText02').value)
    let mySum = myIn01 + myIn02
    let myReply = myIn01 + ' + ' + myIn02 + ' = ' + mySum
    return myReply
  }

</script>
