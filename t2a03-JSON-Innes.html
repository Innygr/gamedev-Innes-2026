<link rel="stylesheet" href="t2-theme.css">

<h1 align="center">t2a20-JSON-Innes.html</h1>

<style>
#myDiv1 {
  margin: 20px auto;
  padding: 15px;
  max-width: 850px;
  background: #20202a;
  color: white;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

#myDiv1 pre {
  white-space: pre-wrap;
  overflow-x: auto;
}

#myDiv1 img {
  display: block;
  max-width: 100%;
  max-height: 350px;
  margin: 15px auto;
  border-radius: 10px;
}

#mySelect {
  display: block;
  margin: 20px auto;
  padding: 10px;
  max-width: 90%;
}
</style>

<script>
const myApis = {
  fox: {
    name: "Random Fox",
    url: "https://randomfox.ca/floof/"
  },
  dog: {
    name: "Random Dog",
    url: "https://dog.ceo/api/breeds/image/random"
  },
  cat: {
    name: "Cat Fact",
    url: "https://catfact.ninja/fact"
  },
  joke: {
    name: "Random Joke",
    url: "https://v2.jokeapi.dev/joke/Any?type=twopart"
  },
  advice: {
    name: "Random Advice",
    url: "https://api.adviceslip.com/advice"
  },
  pokemon: {
    name: "Pokémon",
    url: "https://pokeapi.co/api/v2/pokemon/pikachu"
  },
 weather: {
    name: "City Weather",
    url: "https://api.open-meteo.com/v1/forecast"
  },
  country: {
    name: "Country Information",
    l: "https://restcountries.com/v5.1/name/canada"
  },
};

async function fetchData(apiKey) {
  const output = document.getElementById("myDiv1");

  if (!apiKey || !myApis[apiKey]) {
    output.textContent = "Choose an API first!";
    return;
  }

  const api = myApis[apiKey];

  output.textContent = "Loading " + api.name + "...";

  try {
    const response = await fetch(api.url);

    if (!response.ok) {
      throw new Error("HTTP error " + response.status);
    }

    const data = await response.json();

    output.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = api.name;
    output.appendChild(heading);

    // Build a readable summary
    let summary = "";
    let imageUrl = "";

    switch (apiKey) {
      case "fox":
        summary = "Here's a random fox!";
        imageUrl = data.image;
        break;

      case "dog":
        summary = "Here's a random dog!";
        imageUrl = data.message;
        break;

      case "cat":
        summary = data.fact;
        break;

      case "joke":
        summary = data.type === "twopart"
          ? data.setup + "\n\n" + data.delivery
          : data.joke || "No joke was returned.";
        break;

      case "advice":
        summary = data.slip.advice;
        break;

      case "pokemon":
        summary = "Name: " + data.name +
          "\nID: " + data.id +
          "\nHeight: " + data.height +
          "\nWeight: " + data.weight;
        imageUrl = data.sprites.front_default;
        break;

      case "weather": {
  const city = document.getElementById("weatherCity");
  const coordinates = city.value.split(",");

  const weatherUrl =
    myApis.weather.url +
    "?latitude=" + coordinates[0] +
    "&longitude=" + coordinates[1] +
    "&current=temperature_2m,relative_humidity_2m,wind_speed_10m";

  const weatherResponse = await fetch(weatherUrl);

  if (!weatherResponse.ok) {
    throw new Error("Weather API error: " + weatherResponse.status);
  }

  const weatherData = await weatherResponse.json();

  summary =
    "City: " + city.options[city.selectedIndex].text +
    "\nTemperature: " + weatherData.current.temperature_2m +
    weatherData.current_units.temperature_2m +
    "\nHumidity: " + weatherData.current.relative_humidity_2m + "%" +
    "\nWind Speed: " + weatherData.current.wind_speed_10m +
    weatherData.current_units.wind_speed_10m;

  // Display the actual weather response as JSON.
  data.current = weatherData.current;
  data.current_units = weatherData.current_units;
  data.timezone = weatherData.timezone;

  break;

      case "country": {
  const country = data[0];

  summary =
    "Country: " + country.name.common +
    "\nCapital: " + country.capital.join(", ") +
    "\nRegion: " + country.region +
    "\nPopulation: " + country.population.toLocaleString() +
    "\nCurrency: " +
    Object.values(country.currencies)
      .map(currency => currency.name).join(", ");

  imageUrl = country.flags.png;
  break;
}

    const description = document.createElement("p");
    description.textContent = summary;
    output.appendChild(description);

    if (imageUrl && typeof imageUrl === "string") {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "Image returned by " + api.name;
      output.appendChild(img);
    }

    const jsonHeading = document.createElement("h3");
    jsonHeading.textContent = "Full JSON Response";
    output.appendChild(jsonHeading);

    const json = document.createElement("pre");
    json.textContent = JSON.stringify(data, null, 2);
    output.appendChild(json);

  } catch (error) {
    output.replaceChildren();

    const message = document.createElement("p");
    message.textContent =
      "Could not fetch " + api.name + ": " + error.message;

    output.appendChild(message);

    const link = document.createElement("a");
    link.href = api.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open API directly";
    output.appendChild(link);
  }
}

function fetchAgain() {
  fetchData(document.getElementById("mySelect").value);
}
</script>

<select id="mySelect" onchange="fetchData(this.value)">
  <option value="">-- Choose an API --</option>

  <optgroup label="Animals">
    <option value="fox">Random Fox</option>
    <option value="dog">Random Dog</option>
    <option value="cat">Cat Fact</option>
  </optgroup>

  <optgroup label="Fun">
    <option value="joke">Random Joke</option>
    <option value="advice">Random Advice</option>
  </optgroup>

  <optgroup label="Games">
    <option value="pokemon">Pokémon</option>
  </optgroup>

  <optgroup label="Information">
    <option value="weather">Current Weather</option>
    <option value="country">Country Information</option>
  </optgroup>
</select>

<select id="weatherCity" onchange="
  if (document.getElementById('mySelect').value === 'weather') {
    fetchData('weather');
  }
">
  <option value="49.2827,-123.1207">Vancouver</option>
  <option value="43.6532,-79.3832">Toronto</option>
  <option value="45.5019,-73.5674">Montreal</option>
  <option value="51.5072,-0.1276">London</option>
  <option value="35.6762,139.6503">Tokyo</option>
  <option value="40.7128,-74.0060">New York</option>
  <option value="-33.8688,151.2093">Sydney</option>
</select>

<div align="center">
  <button onclick="fetchAgain()">Fetch Again</button>
</div>

<div id="myDiv1">
  Choose an API from the dropdown above!
</div>
