<h4>Example Working Array code</h4>

Max Array Entry: <input type=number id="myText01" value=3><br><input type=button value="Example onClick" 
onClick="{
  let myTemp = document.getElementById('myText01').value
  let mySum = ''
  document.getElementById('myDiv01').innerHTML = ' '

  myArray = new Array()
  myArray[0] = 'Fred'
  myArray[1] = 'Mary'
  myArray[2] = 'Lizzy'
  myArray[3] = 'Bob'
  myArray[4] = 'Jeff'

  for (let myLoop=0; myLoop < myTemp; myLoop++){
      mySum += 'Loop #: ' + myLoop + ' array entry: ' + myArray[myLoop] +'<br>'
  }
  document.getElementById('myDiv01').innerHTML = mySum
}">

  <div id="myDiv01">...</div>

  <br>

  You can do more arrays that do different things, hopefully some with numbers.<br>
